<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

  <meta name="theme-color" content="#0E1A33">
  <meta name="author" content="Mahzam Co.">
  <title>مِعيار | نظام الجودة للتدريب والتقييم</title>
  <link rel="icon" type="image/svg+xml" href="/assets/miyar-icon.svg">

  <!-- Favicon -->

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0&display=block" rel="stylesheet">
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css?v=82">

  <link rel="stylesheet" href="/css/mahzam-design.css?v=20261022-miyar-2">

  <!-- Third-party Libraries (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.0/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Supabase SDK (Cloud Backend + Realtime) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- EmailJS SDK (Transactional Email) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <!-- ★ #66: مؤشّر التحديث الخلفي (SWR) — شريط علوي 3px + معالجة offline -->
  <div id="updating-bar" style="position:fixed;top:0;left:0;right:0;height:3px;z-index:9998;display:none;opacity:0;transition:opacity .3s ease;background:rgba(59,130,246,.6)">
    <span id="updating-text" style="position:absolute;top:5px;right:12px;font-size:11px;color:#2563eb;font-family:'Cairo',sans-serif;background:#fff;padding:1px 9px;border-radius:0 0 7px 7px;box-shadow:0 1px 4px rgba(0,0,0,.12)">جاري التحديث…</span>
  </div>
  <!-- ★ #66: overlay الإقلاع البارد (مستخدم جديد / بلا كاش) — يحافظ على سلوك اليوم -->
  <div id="boot-overlay" style="position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#f8fafc;font-family:'Cairo',sans-serif">
    <div style="width:44px;height:44px;border:4px solid #dbeafe;border-top-color:#3b82f6;border-radius:50%;animation:qe-spin 1s linear infinite"></div>
    <div style="color:#64748b;font-size:14px">جاري التحميل…</div>
  </div>
  <style>@keyframes qe-spin{to{transform:rotate(360deg)}}</style>

  <!-- Container for the app (populated dynamically by the router) -->
  <div id="app">
    <noscript>
      <div style="padding:40px;text-align:center;font-family:'Cairo',sans-serif">
        <h1 style="color:#06579F">⚠️ يتطلب هذا النظام تفعيل JavaScript</h1>
        <p>الرجاء تفعيل JavaScript في متصفحك ثم إعادة تحميل الصفحة.</p>
      </div>
    </noscript>
  </div>

  <!--
    App modules (load order matters):
      00-supabase-sync.js → طبقة المزامنة مع Supabase + Realtime
      01-constants.js → الشعار + الأسماء + معايير التقييم
      02-db.js       → طبقة قاعدة البيانات (CRUD)
      03-core.js     → calculateScores + Utils + Perms + Toast + Modal
      services/email-service.js → طبقة الإشعارات البريدية (EmailJS)
      04-pages.js    → جميع الصفحات + PDF/Excel exports
      05-app.js      → التشغيل وبدء الجلسة
  -->
  <script src="/js/00-supabase-sync.js?v=98"></script>
  <script src="/js/01-constants.js?v=122-miyar"></script>
  <script src="/js/02-db.js?v=122-miyar"></script>
  <script src="/js/03-core.js?v=122-miyar"></script>
  <script src="/js/services/email-service.js?v=122-miyar"></script>
  <script src="/js/04-pages.js?v=122-miyar"></script>
  <script src="/js/05-app.js?v=99"></script>
  <script src="/js/realtime-service.js?v=95"></script>
</body>
</html>
