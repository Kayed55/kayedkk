name: RPC Source Guard
# يمنع تكرار desync (RPC عميل بلا مصدر) + يتحقق من صياغة js. لا تبعيات npm.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: فحص مصادر RPC + صياغة js
        run: node scripts/check-rpc-sources.js

      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Validate assets and JavaScript
        run: npm run validate
      - name: Regression tests
        run: npm test
      - name: Isolated PostgreSQL tests
        run: npm run test:sql
